name: Tests

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  
jobs:
  tests:
    name: Run integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      # … whatever other steps you need to run your tests

  workflow-keepalive:
    # if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - uses: liskin/gh-workflow-keepalive@v1
